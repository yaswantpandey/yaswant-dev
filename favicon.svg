<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0d0e12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9" />
    </linearGradient>

    <!-- Main "Y" Gradient -->
    <linearGradient id="yGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Accent Secondary Gradient -->
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop Shadow Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge Background -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Glow Node behind Y -->
  <circle cx="50" cy="48" r="22" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />

  <!-- The "Y" Monogram (Futuristic Geometric Vector) -->
  <g filter="url(#glow)">
    <!-- Left Arm to Stem -->
    <path d="M 20 22 L 37 22 L 50 48 L 50 80 L 41 80 L 41 52 L 20 22 Z" fill="url(#yGrad)" />
    <!-- Right Arm -->
    <path d="M 80 22 L 63 22 L 50 48 L 59 52 L 80 22 Z" fill="url(#accentGrad)" />
    <!-- Center Core Energy Diamond -->
    <polygon points="50,42 55,48 50,54 45,48" fill="#ffffff" opacity="0.95" />
    <circle cx="50" cy="48" r="1.5" fill="#22d3ee" />
  </g>
</svg>
