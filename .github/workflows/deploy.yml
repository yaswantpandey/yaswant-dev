name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  web-deploy:
    name: 🚀 Deploy Website to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Verify PHP Syntax
        run: |
          echo "Linting PHP files..."
          find . -type f -name "*.php" ! -path "./.git/*" ! -path "./node_modules/*" -print0 | while IFS= read -r -d '' file; do
            php -l "$file" || exit 1
          done

      - name: 📤 Sync Files to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/node_modules/**
            **/.vscode/**
            **/.gemini/**
            **/scratch/**
            README.md
            sync_config.jsonc
            subdomain.txt
            database.sql
